<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneSmarter Employee Portal & Auth Testing Sandbox</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const API_BASE = "http://127.0.0.1:8000/api";

        function App() {
            const [currentUser, setCurrentUser] = React.useState(null);
            const [activeTab, setActiveTab] = React.useState('dashboard');
            
            // Login Form State
            const [username, setUsername] = React.useState('admin');
            const [password, setPassword] = React.useState('admin123');
            const [loginError, setLoginError] = React.useState('');
            const [isLoggingIn, setIsLoggingIn] = React.useState(false);

            // Dashboard Data State
            const [stats, setStats] = React.useState({ total_employees: 0, active_employees: 0, on_leave: 0, total_departments: 0, department_distribution: [] });
            const [employees, setEmployees] = React.useState([]);
            const [departments, setDepartments] = React.useState([]);
            const [activityLogs, setActivityLogs] = React.useState([]);
            
            // Filter & Search
            const [searchQuery, setSearchQuery] = React.useState('');
            const [selectedDept, setSelectedDept] = React.useState('');

            // Modals
            const [showEmpModal, setShowEmpModal] = React.useState(false);
            const [newEmp, setNewEmp] = React.useState({ employee_id: '', first_name: '', last_name: '', email: '', phone: '', designation: '', salary: 85000, department: '', role: 'EMPLOYEE', status: 'ACTIVE', date_of_joining: new Date().toISOString().split('T')[0] });

            const fetchDashboardData = async () => {
                try {
                    const statsRes = await fetch(`${API_BASE}/dashboard/stats/`);
                    const statsData = await statsRes.json();
                    setStats(statsData);

                    const empRes = await fetch(`${API_BASE}/employees/`);
                    const empData = await empRes.json();
                    setEmployees(empData.results || empData);

                    const deptRes = await fetch(`${API_BASE}/departments/`);
                    const deptData = await deptRes.json();
                    setDepartments(deptData.results || deptData);

                    const logsRes = await fetch(`${API_BASE}/logs/`);
                    const logsData = await logsRes.json();
                    setActivityLogs(logsData.results || logsData);
                } catch (err) {
                    console.error("Failed to fetch dashboard data:", err);
                }
            };

            React.useEffect(() => {
                if (currentUser) {
                    fetchDashboardData();
                }
            }, [currentUser]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsLoggingIn(true);
                setLoginError('');

                try {
                    const res = await fetch(`${API_BASE}/auth/login/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();

                    if (res.ok && data.status === 'success') {
                        setCurrentUser(data.user);
                    } else {
                        setLoginError(data.message || 'Invalid login credentials');
                    }
                } catch (err) {
                    setLoginError('Backend connection error. Please make sure Django server is running.');
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleAddEmployee = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch(`${API_BASE}/employees/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newEmp)
                    });
                    if (res.ok) {
                        setShowEmpModal(false);
                        fetchDashboardData();
                    } else {
                        alert("Error adding employee");
                    }
                } catch (err) {
                    alert("API Connection Error");
                }
            };

            const filteredEmployees = employees.filter(emp => {
                const matchesSearch = (emp.first_name + ' ' + emp.last_name + ' ' + emp.email + ' ' + emp.employee_id).toLowerCase().includes(searchQuery.toLowerCase());
                const matchesDept = selectedDept === '' || String(emp.department) === String(selectedDept);
                return matchesSearch && matchesDept;
            });

            if (!currentUser) {
                return (
                    <div class="min-h-screen flex items-center justify-center bg-slate-950 p-4">
                        <div class="max-w-md w-full bg-slate-900 rounded-2xl border border-slate-800 shadow-2xl p-8">
                            <div class="text-center mb-8">
                                <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-indigo-500/30">
                                    <i class="fa-solid fa-shield-halved text-3xl"></i>
                                </div>
                                <h1 class="text-2xl font-bold text-white">OneSmarter Enterprise</h1>
                                <p class="text-slate-400 text-sm mt-1">Employee Management & Security Sandbox</p>
                            </div>

                            {loginError && (
                                <div class="mb-6 p-4 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-400 text-sm flex items-center gap-3">
                                    <i class="fa-solid fa-circle-exclamation"></i>
                                    <span>{loginError}</span>
                                </div>
                            )}

                            <form onSubmit={handleLogin} class="space-y-5">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Username</label>
                                    <div class="relative">
                                        <i class="fa-solid fa-user absolute left-4 top-3.5 text-slate-500"></i>
                                        <input 
                                            type="text" 
                                            value={username} 
                                            onChange={e => setUsername(e.target.value)} 
                                            class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-white focus:outline-none focus:border-indigo-500 text-sm"
                                            required 
                                        />
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Password</label>
                                    <div class="relative">
                                        <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-500"></i>
                                        <input 
                                            type="password" 
                                            value={password} 
                                            onChange={e => setPassword(e.target.value)} 
                                            class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-white focus:outline-none focus:border-indigo-500 text-sm"
                                            required 
                                        />
                                    </div>
                                </div>

                                <button 
                                    type="submit" 
                                    disabled={isLoggingIn}
                                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2"
                                >
                                    {isLoggingIn ? <i class="fa-solid fa-circle-notch fa-spin"></i> : <i class="fa-solid fa-arrow-right-to-bracket"></i>}
                                    <span>Sign In to Portal</span>
                                </button>
                            </form>

                            <div class="mt-8 pt-6 border-t border-slate-800/80 text-center">
                                <p class="text-xs text-slate-500">Default Demo Credentials: <code class="text-indigo-400 bg-slate-950 px-2 py-1 rounded">admin</code> / <code class="text-indigo-400 bg-slate-950 px-2 py-1 rounded">admin123</code></p>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div class="min-h-screen flex flex-col bg-slate-950">
                    {/* Top Header Navbar */}
                    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30">
                        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-indigo-600/20 text-indigo-400 rounded-xl flex items-center justify-center border border-indigo-500/30">
                                    <i class="fa-solid fa-building-user text-xl"></i>
                                </div>
                                <div>
                                    <h1 class="font-bold text-white text-lg leading-tight">OneSmarter Portal</h1>
                                    <p class="text-xs text-indigo-400">Employee Management & Auth Platform</p>
                                </div>
                            </div>

                            <div class="flex items-center gap-4">
                                <div class="flex items-center gap-3 bg-slate-950 border border-slate-800 px-4 py-2 rounded-xl">
                                    <div class="w-8 h-8 bg-indigo-600 text-white rounded-lg flex items-center justify-center font-bold text-sm">
                                        {currentUser.username[0].toUpperCase()}
                                    </div>
                                    <div class="text-left">
                                        <p class="text-xs font-bold text-white">{currentUser.full_name}</p>
                                        <p class="text-[10px] text-slate-400 uppercase font-semibold">{currentUser.role}</p>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setCurrentUser(null)} 
                                    class="p-2.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition"
                                    title="Logout"
                                >
                                    <i class="fa-solid fa-power-off text-lg"></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Container */}
                    <div class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full">
                        {/* Tab Navigation Menu */}
                        <div class="flex items-center gap-2 mb-8 bg-slate-900 p-1.5 rounded-2xl border border-slate-800 w-fit">
                            {[
                                { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                                { id: 'employees', label: 'Employee Directory', icon: 'fa-users' },
                                { id: 'departments', label: 'Departments', icon: 'fa-sitemap' },
                                { id: 'security', label: 'OSIVault Auth Sandbox', icon: 'fa-shield-keyhole' },
                                { id: 'logs', label: 'Activity Logs', icon: 'fa-clock-rotate-left' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    class={`flex items-center gap-2 px-5 py-2.5 rounded-xl font-semibold text-sm transition ${
                                        activeTab === tab.id 
                                        ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' 
                                        : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                                    }`}
                                >
                                    <i class={`fa-solid ${tab.icon}`}></i>
                                    <span>{tab.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* TAB 1: DASHBOARD */}
                        {activeTab === 'dashboard' && (
                            <div class="space-y-8">
                                {/* Stats Cards */}
                                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                        <div class="flex items-center justify-between text-slate-400 mb-4">
                                            <span class="text-xs font-bold uppercase">Total Staff</span>
                                            <i class="fa-solid fa-users text-xl text-indigo-400"></i>
                                        </div>
                                        <p class="text-3xl font-extrabold text-white">{stats.total_employees}</p>
                                    </div>

                                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                        <div class="flex items-center justify-between text-slate-400 mb-4">
                                            <span class="text-xs font-bold uppercase">Active Employees</span>
                                            <i class="fa-solid fa-user-check text-xl text-emerald-400"></i>
                                        </div>
                                        <p class="text-3xl font-extrabold text-emerald-400">{stats.active_employees}</p>
                                    </div>

                                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                        <div class="flex items-center justify-between text-slate-400 mb-4">
                                            <span class="text-xs font-bold uppercase">On Leave</span>
                                            <i class="fa-solid fa-user-clock text-xl text-amber-400"></i>
                                        </div>
                                        <p class="text-3xl font-extrabold text-amber-400">{stats.on_leave}</p>
                                    </div>

                                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                        <div class="flex items-center justify-between text-slate-400 mb-4">
                                            <span class="text-xs font-bold uppercase">Departments</span>
                                            <i class="fa-solid fa-building text-xl text-cyan-400"></i>
                                        </div>
                                        <p class="text-3xl font-extrabold text-cyan-400">{stats.total_departments}</p>
                                    </div>
                                </div>

                                {/* Department Breakdown Grid */}
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                    <h3 class="text-lg font-bold text-white mb-6 flex items-center gap-2">
                                        <i class="fa-solid fa-chart-simple text-indigo-400"></i>
                                        Department Distribution
                                    </h3>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {stats.department_distribution.map((dept, i) => (
                                            <div key={i} class="bg-slate-950 border border-slate-800/80 p-4 rounded-xl flex items-center justify-between">
                                                <div>
                                                    <p class="font-semibold text-white">{dept.name}</p>
                                                    <p class="text-xs text-slate-500">Code: {dept.code}</p>
                                                </div>
                                                <span class="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 px-3 py-1 rounded-lg text-sm font-bold">
                                                    {dept.count} Members
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: EMPLOYEES DIRECTORY */}
                        {activeTab === 'employees' && (
                            <div class="space-y-6">
                                <div class="flex items-center justify-between gap-4 flex-wrap bg-slate-900 p-4 rounded-2xl border border-slate-800">
                                    <div class="flex items-center gap-3 flex-1 min-w-[280px]">
                                        <div class="relative flex-1">
                                            <i class="fa-solid fa-search absolute left-4 top-3 text-slate-500"></i>
                                            <input 
                                                type="text" 
                                                placeholder="Search by name, ID, or email..." 
                                                value={searchQuery}
                                                onChange={e => setSearchQuery(e.target.value)}
                                                class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 pl-11 pr-4 text-sm text-white focus:outline-none focus:border-indigo-500"
                                            />
                                        </div>

                                        <select 
                                            value={selectedDept} 
                                            onChange={e => setSelectedDept(e.target.value)}
                                            class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                                        >
                                            <option value="">All Departments</option>
                                            {departments.map(d => (
                                                <option key={d.id} value={d.id}>{d.name}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <button 
                                        onClick={() => setShowEmpModal(true)}
                                        class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-5 py-2.5 rounded-xl transition flex items-center gap-2 text-sm shadow-lg shadow-indigo-600/30"
                                    >
                                        <i class="fa-solid fa-user-plus"></i>
                                        <span>Add New Employee</span>
                                    </button>
                                </div>

                                {/* Table */}
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                                    <table class="w-full text-left text-sm text-slate-300">
                                        <thead class="bg-slate-950 text-slate-400 uppercase text-[11px] font-bold border-b border-slate-800">
                                            <tr>
                                                <th class="px-6 py-4">Employee</th>
                                                <th class="px-6 py-4">Department</th>
                                                <th class="px-6 py-4">Role & Title</th>
                                                <th class="px-6 py-4">Status</th>
                                                <th class="px-6 py-4">Joining Date</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-800">
                                            {filteredEmployees.map(emp => (
                                                <tr key={emp.id} class="hover:bg-slate-800/40 transition">
                                                    <td class="px-6 py-4">
                                                        <div class="flex items-center gap-3">
                                                            <div class="w-10 h-10 bg-indigo-600/20 text-indigo-400 font-bold rounded-xl flex items-center justify-center border border-indigo-500/20">
                                                                {emp.first_name[0]}{emp.last_name[0]}
                                                            </div>
                                                            <div>
                                                                <p class="font-semibold text-white">{emp.full_name}</p>
                                                                <p class="text-xs text-slate-500">{emp.email} • <span class="text-slate-400 font-mono">{emp.employee_id}</span></p>
                                                            </div>
                                                        </div>
                                                    </td>
                                                    <td class="px-6 py-4 font-medium text-slate-200">
                                                        {emp.department_name || 'Unassigned'}
                                                    </td>
                                                    <td class="px-6 py-4">
                                                        <p class="text-white font-medium">{emp.designation}</p>
                                                        <span class="text-[10px] uppercase font-bold text-indigo-400">{emp.role}</span>
                                                    </td>
                                                    <td class="px-6 py-4">
                                                        <span class={`px-3 py-1 rounded-full text-xs font-bold border ${
                                                            emp.status === 'ACTIVE' 
                                                            ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' 
                                                            : 'bg-amber-500/10 text-amber-400 border-amber-500/30'
                                                        }`}>
                                                            {emp.status}
                                                        </span>
                                                    </td>
                                                    <td class="px-6 py-4 text-xs text-slate-400">
                                                        {emp.date_of_joining}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: DEPARTMENTS */}
                        {activeTab === 'departments' && (
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {departments.map(dept => (
                                    <div key={dept.id} class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between">
                                        <div>
                                            <div class="flex items-center justify-between mb-3">
                                                <h3 class="text-lg font-bold text-white">{dept.name}</h3>
                                                <span class="bg-slate-950 text-indigo-400 border border-slate-800 font-mono text-xs font-bold px-3 py-1 rounded-lg">
                                                    {dept.code}
                                                </span>
                                            </div>
                                            <p class="text-sm text-slate-400 mb-6">{dept.description}</p>
                                        </div>
                                        <div class="pt-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-500">
                                            <span>Active Members: <strong class="text-white">{dept.employee_count}</strong></span>
                                            <span>Created: {new Date(dept.created_at).toLocaleDateString()}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* TAB 4: OSIVAULT AUTH SANDBOX */}
                        {activeTab === 'security' && (
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 space-y-6">
                                <div class="flex items-center gap-4">
                                    <div class="w-14 h-14 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center border border-indigo-500/30">
                                        <i class="fa-solid fa-key text-2xl"></i>
                                    </div>
                                    <div>
                                        <h2 class="text-xl font-bold text-white">OSIVault Auth Integration Sandbox</h2>
                                        <p class="text-sm text-slate-400">Target Environment for WebAuthn YubiKey & TOTP MFA Module Integration</p>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4">
                                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-6 space-y-4">
                                        <h4 class="font-bold text-white flex items-center gap-2">
                                            <i class="fa-solid fa-[#6366f1] fa-fingerprint text-indigo-400"></i>
                                            YubiKey FIDO2 / WebAuthn Hardware Auth
                                        </h4>
                                        <p class="text-xs text-slate-400 leading-relaxed">
                                            Integrates <code class="text-indigo-400 font-mono">osivault.auth.webauthn</code> to register physical security keys and verify hardware assertion challenges tied to domain origin <code class="text-indigo-400 font-mono">mir.onesmarter.com</code>.
                                        </p>
                                        <button class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-700 text-white font-semibold py-2.5 rounded-xl text-sm transition">
                                            Simulate WebAuthn Challenge
                                        </button>
                                    </div>

                                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-6 space-y-4">
                                        <h4 class="font-bold text-white flex items-center gap-2">
                                            <i class="fa-solid fa-mobile-screen-button text-indigo-400"></i>
                                            TOTP Authenticator App (Replay Protected)
                                        </h4>
                                        <p class="text-xs text-slate-400 leading-relaxed">
                                            Integrates <code class="text-indigo-400 font-mono">osivault.auth.TOTPVerifier</code> with <code class="text-indigo-400 font-mono">valid_window=0</code> and last-counter replay guard to verify Google Authenticator OTP codes.
                                        </p>
                                        <button class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-700 text-white font-semibold py-2.5 rounded-xl text-sm transition">
                                            Simulate TOTP OTP Verification
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 5: ACTIVITY LOGS */}
                        {activeTab === 'logs' && (
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                                <div class="p-6 border-b border-slate-800">
                                    <h3 class="text-lg font-bold text-white flex items-center gap-2">
                                        <i class="fa-solid fa-list-check text-indigo-400"></i>
                                        Security & Audit Logs
                                    </h3>
                                </div>
                                <table class="w-full text-left text-sm text-slate-300">
                                    <thead class="bg-slate-950 text-slate-400 uppercase text-[11px] font-bold border-b border-slate-800">
                                        <tr>
                                            <th class="px-6 py-4">Actor</th>
                                            <th class="px-6 py-4">Action</th>
                                            <th class="px-6 py-4">Details</th>
                                            <th class="px-6 py-4">IP Address</th>
                                            <th class="px-6 py-4">Timestamp</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-800 font-mono text-xs">
                                        {activityLogs.map(log => (
                                            <tr key={log.id} class="hover:bg-slate-800/40 transition">
                                                <td class="px-6 py-4 font-bold text-indigo-400">{log.actor_username}</td>
                                                <td class="px-6 py-4">
                                                    <span class="bg-slate-950 border border-slate-800 px-2 py-1 rounded text-white font-semibold">
                                                        {log.action}
                                                    </span>
                                                </td>
                                                <td class="px-6 py-4 text-slate-400">{log.details}</td>
                                                <td class="px-6 py-4 text-slate-500">{log.ip_address || '127.0.0.1'}</td>
                                                <td class="px-6 py-4 text-slate-500">{new Date(log.timestamp).toLocaleString()}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>

                    {/* MODAL: ADD EMPLOYEE */}
                    {showEmpModal && (
                        <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 shadow-2xl space-y-6">
                                <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                                    <h3 class="text-lg font-bold text-white">Add New Employee</h3>
                                    <button onClick={() => setShowEmpModal(false)} class="text-slate-400 hover:text-white">
                                        <i class="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleAddEmployee} class="space-y-4">
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-400 mb-1">Employee ID</label>
                                            <input type="text" placeholder="EMP-1006" value={newEmp.employee_id} onChange={e => setNewEmp({...newEmp, employee_id: e.target.value})} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white" required />
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-400 mb-1">Role</label>
                                            <select value={newEmp.role} onChange={e => setNewEmp({...newEmp, role: e.target.value})} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white">
                                                <option value="EMPLOYEE">Employee</option>
                                                <option value="MANAGER">Manager</option>
                                                <option value="ADMIN">Admin</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-400 mb-1">First Name</label>
                                            <input type="text" value={newEmp.first_name} onChange={e => setNewEmp({...newEmp, first_name: e.target.value})} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white" required />
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-400 mb-1">Last Name</label>
                                            <input type="text" value={newEmp.last_name} onChange={e => setNewEmp({...newEmp, last_name: e.target.value})} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white" required />
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-semibold text-slate-400 mb-1">Email</label>
                                        <input type="email" value={newEmp.email} onChange={e => setNewEmp({...newEmp, email: e.target.value})} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white" required />
                                    </div>

                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-400 mb-1">Designation</label>
                                            <input type="text" placeholder="Software Engineer" value={newEmp.designation} onChange={e => setNewEmp({...newEmp, designation: e.target.value})} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white" required />
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-400 mb-1">Department</label>
                                            <select value={newEmp.department} onChange={e => setNewEmp({...newEmp, department: e.target.value})} class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white">
                                                <option value="">Select Department</option>
                                                {departments.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-800">
                                        <button type="button" onClick={() => setShowEmpModal(false)} class="px-4 py-2 text-sm text-slate-400 hover:text-white">Cancel</button>
                                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-5 py-2 rounded-xl text-sm">Save Employee</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
