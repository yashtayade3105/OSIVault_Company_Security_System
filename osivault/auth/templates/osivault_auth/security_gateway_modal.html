<!-- OSIVault Pre-Platform Security Gateway Modal Widget (Django Template) -->
<div id="osivault-security-gateway-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-md transition-all">
    
    <!-- Bright Vibrant Background Gradient Blurs -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[30rem] h-[30rem] bg-gradient-to-tr from-purple-400/30 via-indigo-400/20 to-cyan-400/30 blur-3xl rounded-full pointer-events-none"></div>
    <div class="absolute bottom-1/4 left-1/3 w-96 h-96 bg-amber-400/20 blur-3xl rounded-full pointer-events-none"></div>

    <!-- Bright Modern Colorful Card Container -->
    <div class="relative w-full max-w-xl bg-white/95 border-2 border-slate-200/80 rounded-3xl shadow-2xl overflow-hidden p-6 sm:p-8 space-y-6 backdrop-blur-2xl text-slate-900">
        
        <!-- Top Header & Branding -->
        <div class="flex items-start justify-between pb-4 border-b border-slate-100">
            <div class="flex items-center gap-3.5">
                <div class="relative w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-cyan-500 flex items-center justify-center text-white shadow-xl shadow-purple-500/30 shrink-0">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                    <div class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-cyan-400 border-2 border-white rounded-full animate-ping opacity-90"></div>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h3 class="text-xl font-black text-slate-900 tracking-tight">
                            OSIVault Security Gateway
                        </h3>
                        <span class="px-3 py-1 rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-[10px] font-black tracking-wider uppercase flex items-center gap-1 shadow-sm">
                            Zero-Trust
                        </span>
                    </div>
                    <p class="text-xs text-slate-600 font-semibold mt-0.5">Do you want to add extra security to your website platform session?</p>
                </div>
            </div>
            <button onclick="closeOSIVaultGatewayModal()" class="p-2 rounded-xl text-slate-400 hover:text-slate-800 hover:bg-slate-100 transition-all cursor-pointer" title="Close">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- Visual Step Progress Indicator -->
        <div class="grid grid-cols-3 gap-2 py-1">
            <div id="osivault-step-bar-1" class="h-2 rounded-full bg-gradient-to-r from-purple-600 to-cyan-500 shadow-md shadow-purple-500/30 transition-all duration-300"></div>
            <div id="osivault-step-bar-2" class="h-2 rounded-full bg-slate-100 border border-slate-200 transition-all duration-300"></div>
            <div id="osivault-step-bar-3" class="h-2 rounded-full bg-slate-100 border border-slate-200 transition-all duration-300"></div>
        </div>

        <!-- Dynamic Status Banner -->
        <div id="osivault-modal-banner" class="hidden p-4 rounded-2xl text-xs sm:text-sm font-bold border-2 shadow-md transition-all"></div>

        <!-- Step 1: Input Email -->
        <div id="osivault-step-email" class="space-y-5">
            <div class="space-y-2">
                <label class="block text-xs font-black text-slate-700 uppercase tracking-wider flex items-center justify-between">
                    <span>REGISTERED EMAIL ID / ACCOUNT</span>
                    <span class="text-[10px] text-purple-600 font-extrabold bg-purple-50 px-2 py-0.5 rounded-md border border-purple-200">Step 1 of 3</span>
                </label>
                <div class="relative">
                    <svg class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    <input 
                        type="email" 
                        id="osivault-modal-email-input" 
                        placeholder="e.g. mh25cv3375@gmail.com" 
                        class="w-full pl-12 pr-4 py-4 rounded-2xl bg-slate-50/80 border-2 border-slate-200 text-slate-900 placeholder-slate-400 font-bold text-sm focus:outline-none focus:bg-white focus:border-purple-600 focus:ring-4 focus:ring-purple-600/10 transition-all shadow-inner"
                    />
                </div>
            </div>
            <button onclick="handleOSIVaultCheckMFA()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-purple-600 via-indigo-600 to-cyan-500 hover:from-purple-700 hover:to-cyan-600 text-white font-black text-sm shadow-xl shadow-purple-600/30 hover:shadow-purple-600/50 transition-all cursor-pointer flex items-center justify-center gap-2">
                <span>Check MFA Security Status</span>
                <span>→</span>
            </button>
            <div class="grid grid-cols-3 gap-2 pt-2 text-[11px] font-bold text-center">
                <div class="p-2.5 rounded-xl bg-purple-50 text-purple-700 border border-purple-200 shadow-sm flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    <span>FIDO2 Hardware</span>
                </div>
                <div class="p-2.5 rounded-xl bg-cyan-50 text-cyan-700 border border-cyan-200 shadow-sm flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-cyan-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                    <span>Replay Guard</span>
                </div>
                <div class="p-2.5 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 shadow-sm flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    <span>Zero-Trust</span>
                </div>
            </div>
        </div>

        <!-- Step 2: Show Options -->
        <div id="osivault-step-options" class="hidden space-y-4">
            <div class="flex items-center justify-between p-3.5 rounded-2xl bg-purple-50/80 border-2 border-purple-200 text-xs text-slate-700 font-bold">
                <span>Account: <strong id="osivault-account-display" class="text-purple-900"></strong></span>
                <button onclick="resetOSIVaultStep()" class="text-[11px] font-extrabold text-purple-700 hover:text-purple-900 underline transition-all">
                    Change Email
                </button>
            </div>
            <div id="osivault-options-container" class="space-y-3"></div>
        </div>

        <!-- Step 3: TOTP Code Input -->
        <div id="osivault-step-totp" class="hidden space-y-5">
            <div class="space-y-2 text-center">
                <label class="block text-xs font-black text-slate-800 uppercase tracking-widest">
                    ENTER 6-DIGIT AUTHENTICATOR PASSCODE
                </label>
                <p class="text-xs text-slate-600 font-bold">Open Google Authenticator / Authy app and enter 6-digit code.</p>
                <input 
                    type="text" 
                    id="osivault-totp-input" 
                    maxlength="6" 
                    placeholder="123456" 
                    class="w-full max-w-xs mx-auto px-4 py-4 rounded-2xl bg-indigo-50/50 border-2 border-indigo-300 text-center text-3xl font-mono tracking-widest text-indigo-900 placeholder-slate-300 font-black focus:outline-none focus:bg-white focus:border-indigo-600 focus:ring-4 focus:ring-indigo-600/10 transition-all shadow-inner"
                />
            </div>
            <div class="flex gap-3">
                <button onclick="showOSIVaultOptions()" class="px-5 py-3.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-xs border border-slate-300 transition-all cursor-pointer">
                    Back
                </button>
                <button onclick="handleOSIVaultVerifyTOTP()" class="flex-1 py-3.5 rounded-2xl bg-gradient-to-r from-indigo-600 via-purple-600 to-cyan-500 hover:from-indigo-700 hover:to-cyan-600 text-white font-black text-sm shadow-xl shadow-indigo-600/30 transition-all cursor-pointer">
                    Verify TOTP Authenticator
                </button>
            </div>
        </div>

        <!-- Footer Skip Option -->
        <div id="osivault-modal-footer" class="pt-4 border-t border-slate-100 flex items-center justify-between text-xs">
            <span class="text-slate-500 font-bold">Do not want extra MFA security right now?</span>
            <button onclick="closeOSIVaultGatewayModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold border border-slate-200 hover:border-slate-300 transition-all cursor-pointer">
                Skip & Continue to Platform →
            </button>
        </div>

    </div>
</div>

<script>
    function closeOSIVaultGatewayModal() {
        const modal = document.getElementById('osivault-security-gateway-modal');
        if (modal) modal.classList.add('hidden');
    }

    function updateStepBar(step) {
        const b1 = document.getElementById('osivault-step-bar-1');
        const b2 = document.getElementById('osivault-step-bar-2');
        const b3 = document.getElementById('osivault-step-bar-3');
        if (!b1 || !b2 || !b3) return;

        b1.className = 'h-2 rounded-full transition-all duration-300 ' + (step >= 1 ? 'bg-gradient-to-r from-purple-600 to-cyan-500 shadow-md shadow-purple-500/30' : 'bg-slate-100 border border-slate-200');
        b2.className = 'h-2 rounded-full transition-all duration-300 ' + (step >= 2 ? 'bg-gradient-to-r from-purple-600 to-cyan-500 shadow-md shadow-purple-500/30' : 'bg-slate-100 border border-slate-200');
        b3.className = 'h-2 rounded-full transition-all duration-300 ' + (step >= 3 ? 'bg-gradient-to-r from-emerald-500 to-teal-400 shadow-md shadow-emerald-500/30' : 'bg-slate-100 border border-slate-200');
    }

    function showOSIVaultBanner(msg, type = 'info') {
        const b = document.getElementById('osivault-modal-banner');
        if (!b) return;
        b.className = `p-4 rounded-2xl text-xs sm:text-sm font-bold border-2 shadow-md transition-all ${
            type === 'error' ? 'bg-rose-50 text-rose-800 border-rose-200 shadow-rose-100' :
            type === 'success' ? 'bg-emerald-50 text-emerald-800 border-emerald-200 shadow-emerald-100' :
            'bg-indigo-50 text-indigo-900 border-indigo-200 shadow-indigo-100'
        }`;
        b.innerText = msg;
        b.classList.remove('hidden');
    }

    async function handleOSIVaultCheckMFA() {
        const email = document.getElementById('osivault-modal-email-input').value.trim();
        if (!email) {
            showOSIVaultBanner('Please enter your registered Email ID or Username.', 'error');
            return;
        }

        try {
            const res = await fetch(`/osivault/auth/api/user/mfa-status/?email=${encodeURIComponent(email)}`);
            const data = await res.json();

            if (data.status === 'success') {
                showOSIVaultBanner(data.message, 'info');
                document.getElementById('osivault-step-email').classList.add('hidden');
                document.getElementById('osivault-step-options').classList.remove('hidden');
                document.getElementById('osivault-account-display').innerText = data.email || email;
                updateStepBar(2);

                const container = document.getElementById('osivault-options-container');
                container.innerHTML = '';

                if (!data.exists || (!data.has_yubikey && !data.has_totp)) {
                    container.innerHTML = `
                        <div class="p-5 rounded-2xl bg-amber-50 border-2 border-amber-300 space-y-4 shadow-sm">
                            <p class="text-xs sm:text-sm text-amber-900 font-bold">No YubiKey Hardware or TOTP Authenticator is linked to <strong>${email}</strong> yet.</p>
                            <a href="/osivault/auth/portal/" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-slate-950 font-black text-xs shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2 cursor-pointer">
                                <span>Go to OSIVault Account & MFA Setup Studio</span>
                                <span>→</span>
                            </a>
                        </div>
                    `;
                } else {
                    if (data.has_yubikey && data.has_totp) {
                        container.innerHTML += `
                            <p class="text-xs font-black text-slate-700 tracking-wide uppercase flex items-center gap-1.5 pb-1">
                                <svg class="w-3.5 h-3.5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                <span>Select Multi-Factor Method (Both Enabled):</span>
                            </p>
                        `;
                    }
                    if (data.has_yubikey) {
                        container.innerHTML += `
                            <button onclick="handleOSIVaultYubiKeyAuth('${email}')" class="w-full p-4 rounded-2xl bg-gradient-to-r from-amber-50/90 via-orange-50/80 to-purple-50/90 hover:from-amber-100 hover:to-purple-100 border-2 border-amber-300/80 hover:border-amber-400 text-left flex items-center justify-between group cursor-pointer transition-all shadow-md">
                                <div class="flex items-center gap-3.5">
                                    <div class="w-11 h-11 rounded-2xl bg-amber-500 text-white flex items-center justify-center font-bold shrink-0 shadow-md shadow-amber-500/30">
                                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                                    </div>
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <span class="text-sm font-black text-slate-900 group-hover:text-purple-900">Authenticate via YubiKey Hardware</span>
                                            <span class="px-2.5 py-0.5 rounded-full bg-amber-500 text-slate-950 text-[10px] font-black shadow-sm">Hardware Sensor</span>
                                        </div>
                                        <div class="text-xs text-slate-600 font-bold">FIDO2 CTAP2 Touch Contact Verification (${data.yubikey_count || 1} active slot)</div>
                                    </div>
                                </div>
                                <span class="text-amber-600 font-bold">→</span>
                            </button>
                        `;
                    }
                    if (data.has_totp) {
                        container.innerHTML += `
                            <button onclick="showOSIVaultTOTPStep('${email}')" class="w-full p-4 rounded-2xl bg-gradient-to-r from-indigo-50/90 via-purple-50/80 to-cyan-50/90 hover:from-indigo-100 hover:to-cyan-100 border-2 border-indigo-300/80 hover:border-indigo-400 text-left flex items-center justify-between group cursor-pointer transition-all shadow-md">
                                <div class="flex items-center gap-3.5">
                                    <div class="w-11 h-11 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-bold shrink-0 shadow-md shadow-indigo-600/30">
                                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                                    </div>
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <span class="text-sm font-black text-slate-900 group-hover:text-indigo-900">Authenticate via TOTP App</span>
                                            <span class="px-2.5 py-0.5 rounded-full bg-indigo-600 text-white text-[10px] font-black shadow-sm">6-Digit Passcode</span>
                                        </div>
                                        <div class="text-xs text-slate-600 font-bold">Google Authenticator / Authy / 1Password App</div>
                                    </div>
                                </div>
                                <span class="text-indigo-600 font-bold">→</span>
                            </button>
                        `;
                    }
                }
            } else {
                showOSIVaultBanner(data.message || 'Error checking MFA status', 'error');
            }
        } catch (err) {
            showOSIVaultBanner('Network error checking MFA status', 'error');
        }
    }

    function resetOSIVaultStep() {
        document.getElementById('osivault-step-options').classList.add('hidden');
        document.getElementById('osivault-step-email').classList.remove('hidden');
        updateStepBar(1);
    }

    function showOSIVaultTOTPStep(email) {
        document.getElementById('osivault-step-options').classList.add('hidden');
        document.getElementById('osivault-step-totp').classList.remove('hidden');
        window._osivault_target_email = email;
    }

    function showOSIVaultOptions() {
        document.getElementById('osivault-step-totp').classList.add('hidden');
        document.getElementById('osivault-step-options').classList.remove('hidden');
    }

    async function handleOSIVaultVerifyTOTP() {
        const code = document.getElementById('osivault-totp-input').value.trim();
        const email = window._osivault_target_email;

        try {
            const res = await fetch('/osivault/auth/api/totp/verify/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code, email })
            });
            const data = await res.json();

            if (res.ok && data.status === 'success') {
                showOSIVaultBanner(data.message, 'success');
                updateStepBar(3);
                setTimeout(() => closeOSIVaultGatewayModal(), 1500);
            } else {
                showOSIVaultBanner(data.message || 'Verification failed.', 'error');
            }
        } catch (err) {
            showOSIVaultBanner('Error verifying TOTP code.', 'error');
        }
    }

    async function handleOSIVaultYubiKeyAuth(email) {
        showOSIVaultBanner('Fetching YubiKey Assertion Challenge... Insert YubiKey & touch golden sensor.', 'info');
        try {
            const optRes = await fetch(`/osivault/auth/api/webauthn/assertion/options/?username=${encodeURIComponent(email)}`);
            const optData = await optRes.json();

            if (!optRes.ok || optData.status !== 'success') {
                showOSIVaultBanner(optData.message || 'Failed to initialize YubiKey assertion.', 'error');
                return;
            }

            const opts = optData.options;
            let verifiedCredId = null;

            if (window.PublicKeyCredential && window.navigator.credentials) {
                try {
                    const allowCreds = opts.allowCredentials ? opts.allowCredentials.map(c => ({
                        id: base64UrlToBuffer(c.id),
                        type: 'public-key',
                        transports: ['usb', 'nfc', 'internal']
                    })) : [];

                    const publicKeyOptions = {
                        challenge: base64UrlToBuffer(opts.challenge),
                        rpId: opts.rpId || window.location.hostname,
                        allowCredentials: allowCreds.length > 0 ? allowCreds : undefined,
                        userVerification: 'preferred',
                        timeout: 60000,
                    };

                    const assertion = await navigator.credentials.get({ publicKey: publicKeyOptions });
                    if (assertion) {
                        verifiedCredId = bufferToBase64Url(assertion.rawId);
                    }
                } catch (webauthnErr) {
                    console.warn('YubiKey assertion exception:', webauthnErr);
                }
            }

            const verifyRes = await fetch('/osivault/auth/api/webauthn/assertion/verify/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ credential_id: verifiedCredId, email: email })
            });
            const verifyData = await verifyRes.json();

            if (verifyRes.ok && verifyData.status === 'success') {
                showOSIVaultBanner(verifyData.message, 'success');
                updateStepBar(3);
                setTimeout(() => closeOSIVaultGatewayModal(), 1500);
            } else {
                showOSIVaultBanner(verifyData.message || 'YubiKey verification failed.', 'error');
            }
        } catch (err) {
            showOSIVaultBanner('Error verifying YubiKey touch.', 'error');
        }
    }
</script>
